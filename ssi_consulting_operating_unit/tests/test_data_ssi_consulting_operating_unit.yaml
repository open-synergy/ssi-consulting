setup:
  steps:
    - step: "Create shared partner"
      action: "create"
      model: "res.partner"
      save_as: "partner"
      values:
        name: "OU Consulting Partner"
        is_company: true

    - step: "Create shared consulting service type"
      action: "create"
      model: "consulting_service_type"
      save_as: "service_type"
      values:
        name: "OU Consulting Service Type"
        code: "/"

    - step: "Create shared schema parser"
      action: "create"
      model: "schema_parser"
      save_as: "schema_parser"
      values:
        name: "OU Consulting Schema Parser"
        code: "/"

    - step: "Create shared consulting service (parent record)"
      action: "create"
      model: "consulting_service"
      save_as: "service"
      values:
        type_id: "REC: service_type.id"
        date: 2026-01-15
        date_start: 2026-01-15
        date_end: 2026-01-31
        partner_id: "REC: partner.id"

scenarios:
  - name: "Create Consulting Service with Operating Unit"
    steps:
      - step: "Create consulting_service with operating_unit_id"
        action: "create"
        model: "consulting_service"
        save_as: "record"
        values:
          type_id: "REC: service_type.id"
          date: 2026-02-01
          date_start: 2026-02-01
          date_end: 2026-02-28
          partner_id: "REC: partner.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert operating_unit_id is set"
        action: "assert"
        target: "record"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "Create Business Process with Operating Unit"
    steps:
      - step: "Create consulting_service.business_process with operating_unit_id"
