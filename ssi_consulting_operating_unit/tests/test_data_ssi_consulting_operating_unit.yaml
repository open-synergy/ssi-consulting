  - name: "User without operating unit access cannot read or write consulting_service"
    steps:
      - step: "Create restricted operating unit"
        action: "create"
        model: "operating.unit"
        save_as: "ou_restricted"
        values:
          name: "OU Restricted Test Consulting"
          code: "OURESTRICTEDCONSULTING"
          partner_id: "REC: company.partner_id.id"

      - step: "Create user without access to main operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Restricted OU User Consulting"
          login: "restricted_ou_user_consulting@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_consulting.consulting_service_user_group"
                - "REF: ssi_consulting_operating_unit.consulting_service_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_restricted.id"

      - step: "Create consulting_service with main operating unit"
        action: "create"
        model: "consulting_service"
        save_as: "record"
        values:
          type_id: "REC: service_type.id"
          date: 2026-02-05
          date_start: 2026-02-05
          date_end: 2026-02-28
          partner_id: "REC: partner.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Restricted user cannot read the record"
        action: "call"
        target: "record"
        method: "read"
        args:
          - - "date"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"

      - step: "Restricted user cannot write the record"
        action: "write"
        target: "record"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"
        values:
          date: 2026-02-10
